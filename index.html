<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Goat Records</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/production.css" />
    <link rel="stylesheet" href="styles/management.css" />
    <link rel="stylesheet" href="styles/road.css" />
    <link rel="stylesheet" href="styles/industry.css" />
    <link rel="stylesheet" href="styles/activities.css" />
    <link rel="stylesheet" href="styles/hq.css" />
    <link rel="stylesheet" href="styles/campaign.css" />
    <link rel="stylesheet" href="styles/locations.css" />
    <link rel="stylesheet" href="styles/promotion.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="styles/lot.css" />
    <link rel="stylesheet" href="styles/places.css" />
    <link rel="stylesheet" href="styles/ceo.css" />
  </head>
  <body>
    <header id="hudbar" class="hudbar">
      <div class="hud-top">
        <div class="brand">
          <span class="logo">g.</span>
          <div><b>GOAT RECORDS</b><small id="rank" class="hud-rank"></small></div>
        </div>
        <section id="stats" class="stats" aria-label="Label status"></section>
        <button id="sound" class="hud-sound">Sound off</button>
      </div>
      <div class="hud-bottom">
        <div class="hud-date"><strong id="date"></strong><small id="trend"></small></div>
        <span id="hud" class="hud-chips"></span>
        <div class="clock" aria-label="Clock">
          <div id="clock" class="clock-buttons" role="group" aria-label="Game speed"></div>
          <button id="advance" class="primary step">Next week ›</button
          ><button id="continueCareer" class="primary" hidden>Continue career →</button>
        </div>
        <button id="clockReason" class="clock-reason" data-action="showModal" aria-live="polite"></button>
      </div>
      <div class="clock-progress" aria-hidden="true"><span id="clockProgress"></span></div>
    </header>
    <main id="app" class="stage">
      <section id="scene" class="scene" aria-label="Label headquarters">
        <div class="sky" aria-hidden="true">
          <i class="sun"></i><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i
          ><i class="skyline"></i>
        </div>
        <div class="lot-wrap">
          <div id="lotRoof" class="roof"></div>
          <div class="building-wrap">
            <div id="lot"></div>
            <div id="lotPeople" class="people" aria-hidden="true"></div>
          </div>
          <div id="lotGround" class="ground"></div>
        </div>
        <div id="lotTown" class="town-row"></div>
        <aside id="lotPopover" class="lot-popover" aria-live="polite" hidden></aside>
      </section>
      <aside id="ticker" class="ticker" aria-label="Label activity">
        <section id="goal" class="goal"></section>
        <section id="roster" aria-label="Roster and team"></section>
        <section id="notices"></section>
        <section id="activities" aria-label="Active activities"></section>
        <section id="studioQueue" aria-label="Albums in the studio"></section>
        <section id="feed" class="feed" aria-label="Latest news"></section>
      </aside>
    </main>
    <section id="drawer" class="drawer" role="dialog" aria-labelledby="drawerTitle" hidden>
      <div class="drawer-head">
        <h2 id="drawerTitle"></h2>
        <button class="close" data-action="closePanel" aria-label="Close panel">Close ✕</button>
      </div>
      <div id="content"></div>
    </section>
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Decisions" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <span class="tag">TIME IS PAUSED</span><button data-action="hideModal">View the lot</button>
        </div>
        <section id="outcome"></section>
        <section id="event"></section>
        <section id="milestones" aria-label="Label news"></section>
        <section id="production" aria-label="Album production"></section>
      </div>
    </section>
    <p id="message" class="toast" role="status" aria-live="polite"></p>
    <footer>
      <span>Tap a person or place to open it. Time stops while a panel is open.</span>
      <div>
        <button id="testFunds" hidden>Testing: +$100,000</button><button id="export">Export save</button
        ><label class="filebutton"
          >Import save<input id="import" type="file" accept="application/json,.json" /></label
        ><button id="reset">New label</button>
      </div>
      <small id="saveStatus"
        >Autosave is on when browser storage is available. Keep an exported backup.</small
      >
    </footer>
    <script src="src/data/core.js"></script>
    <script src="src/data/label.js"></script>
    <script src="src/data/campaign.js"></script>
    <script src="src/data/locations.js"></script>
    <script src="src/data/promotion.js"></script>
    <script src="src/data/company.js"></script>
    <script src="src/systems/label.js"></script>
    <script src="src/systems/campaign.js"></script>
    <script src="src/systems/locations.js"></script>
    <script src="src/systems/promotion.js"></script>
    <script src="src/systems/company.js"></script>
    <script src="src/engine.js"></script>
    <script src="src/ui/registry.js"></script>
    <script src="src/ui/label-ui.js"></script>
    <script src="src/ui/campaign.js"></script>
    <script src="src/ui/locations.js"></script>
    <script src="src/ui/promotion.js"></script>
    <script src="src/ui/company.js"></script>
    <script src="src/ui/lot.js"></script>
    <script src="src/ui/places.js"></script>
    <script src="src/ui/clock.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
