name: Publish game versions
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
# A release published on the website can also fire the tag event; run one at a time.
concurrency:
  group: publish-releases
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node run-checks.cjs
      - name: Tag the newest changelog version
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+$' CHANGELOG.md | cut -c4-)
          if [ -z "$version" ]; then echo "No version heading in CHANGELOG.md"; exit 0; fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already tagged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Goat Records $version" "$GITHUB_SHA"
          git push origin "refs/tags/$version"
      - name: Publish missing version packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p packages
          for version in $(git tag --list 'v*' --sort=version:refname); do
            zip="packages/Goat-Records-$version.zip"
            git archive --format=zip --prefix=Goat-Records/ --output="$zip" "$version"
            {
              awk -v v="## $version" '$0==v{on=1;next} on&&/^## /{exit} on' CHANGELOG.md
              printf '\nDownload and extract the ZIP, then open Start Game.cmd. README.md and VALIDATION.md are inside the package.\n'
            } > packages/notes.md
            if ! gh release view "$version" >/dev/null 2>&1; then
              gh release create "$version" "$zip" --verify-tag --title "Goat Records $version" --notes-file packages/notes.md
              continue
            fi
            # Releases published from the GitHub website get the package, and changelog notes if left blank.
            if ! gh release view "$version" --json assets --jq '.assets[].name' | grep -qx "Goat-Records-$version.zip"; then
              gh release upload "$version" "$zip" --clobber
            fi
            if [ -z "$(gh release view "$version" --json body --jq '.body' | tr -d '[:space:]')" ]; then
              gh release edit "$version" --notes-file packages/notes.md
            fi
          done
